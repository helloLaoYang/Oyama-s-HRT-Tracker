name: HRTTracker
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  knownRegions: [en, zh-Hans]
packages:
  HRTEngine:
    path: Packages/HRTEngine
targets:
  HRTTracker:
    type: application
    platform: iOS
    sources: [HRTTracker]
    dependencies:
      - package: HRTEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hellolaoyang.hrttracker.dev
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: HRT Tracker
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: 5.0
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
  HRTTrackerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [HRTTrackerUITests]
    dependencies:
      - target: HRTTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hellolaoyang.hrttracker.dev.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 5.0
schemes:
  HRTTracker:
    build:
      targets:
        HRTTracker: all
    test:
      targets: [HRTTrackerUITests]
