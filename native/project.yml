name: HRTTracker
options:
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  developmentLanguage: en
  knownRegions: [en, zh-Hans, de, fr, ja]
packages:
  HRTEngine:
    path: Packages/HRTEngine
targetTemplates:
  WatchTarget:
    platform: watchOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "4"
        CODE_SIGN_ENTITLEMENTS: WatchShared/Watch.entitlements
targets:
  HRTTracker:
    type: application
    platform: iOS
    configFiles:
      Debug: Feedback.xcconfig
      Release: Feedback.xcconfig
    sources:
      - path: HRTTracker
        excludes: [Info.plist]
      - WatchShared/WatchSnapshot.swift
      - path: ../LICENSE
        buildPhase: resources
    dependencies:
      - package: HRTEngine
      - target: HRTTrackerWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hellolaoyang.hrttracker.dev
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: HRTTracker/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: HRTrace
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: 5.0
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
  HRTTrackerWatch:
    templates: [WatchTarget]
    type: application
    sources:
      - path: HRTTrackerWatch
        excludes: [Info.plist]
      - WatchShared/WatchSnapshot.swift
      - WatchShared/Localization
    dependencies:
      - target: HRTTrackerWatchWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hellolaoyang.hrttracker.dev.watchkitapp
        INFOPLIST_FILE: HRTTrackerWatch/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: HRTrace
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
  HRTTrackerWatchWidgets:
    templates: [WatchTarget]
    type: app-extension
    sources:
      - path: HRTTrackerWatchWidgets
        excludes: [Info.plist]
      - WatchShared/WatchSnapshot.swift
      - WatchShared/Localization
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hellolaoyang.hrttracker.dev.watchkitapp.widgets
        INFOPLIST_FILE: HRTTrackerWatchWidgets/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: HRTrace
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  HRTTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - HRTTrackerTests
      - path: ../tests/fixtures/medication-cost-backup.json
        buildPhase: resources
    dependencies:
      - target: HRTTracker
      - package: HRTEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hellolaoyang.hrttracker.dev.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 5.0
  HRTTrackerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [HRTTrackerUITests]
    dependencies:
      - target: HRTTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hellolaoyang.hrttracker.dev.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 5.0
schemes:
  HRTTracker:
    build:
      targets:
        HRTTracker: all
    test:
      targets: [HRTTrackerTests, HRTTrackerUITests]
  HRTTrackerWatch:
    build:
      targets:
        HRTTrackerWatch: all
