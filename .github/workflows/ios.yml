name: iOS

# Proves the Capacitor Xcode project still archives. The artifact is unsigned,
# so it cannot be installed on an iPhone. Signing happens on the maintainer's
# Mac with their own Apple ID; see README.zh-CN.md.
on:
  pull_request:
    paths:
      - "ios/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - ".github/workflows/ios.yml"
  push:
    branches:
      - main
    paths:
      - "ios/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unsigned:
    name: Unsigned archive
    # Capacitor 8 needs Xcode 26, which is the default on this image.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the web bundle and sync it into the Xcode project
        run: npm run build:ios

      - name: Archive without signing
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/HRTTracker.xcarchive"
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
          APP="$ARCHIVE/Products/Applications/App.app"
          test -d "$APP"
          STAGE="$RUNNER_TEMP/ipa-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/Payload"
          cp -R "$APP" "$STAGE/Payload/App.app"
          ditto -c -k --keepParent "$STAGE/Payload" "$RUNNER_TEMP/HRTTracker-unsigned.ipa"
          ditto -c -k --keepParent "$ARCHIVE" "$RUNNER_TEMP/HRTTracker.xcarchive.zip"

      - name: Upload unsigned archive
        uses: actions/upload-artifact@v4
        with:
          name: hrt-tracker-ios-unsigned
          path: |
            ${{ runner.temp }}/HRTTracker-unsigned.ipa
            ${{ runner.temp }}/HRTTracker.xcarchive.zip
          if-no-files-found: error
          retention-days: 14
